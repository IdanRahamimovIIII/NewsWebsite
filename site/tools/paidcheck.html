<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>בדיקת נתוני תשלומים — הכסף שלנו</title>
<link rel="stylesheet" href="../shared/style.css">
<style>
  .card { border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin: 12px 0; }
  .row { display: flex; gap: 10px; align-items: baseline; padding: 5px 0; border-bottom: 1px solid var(--grid); }
  .row:last-child { border-bottom: 0; }
  .st { font-weight: 700; width: 1.4em; }
  .ok { color: #1a7f37; } .bad { color: #b42318; }
  .u { color: var(--ink-3); font-size: 12.5px; direction: ltr; text-align: left; word-break: break-all; }
  .big { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
  .hint { color: var(--ink-2); font-size: 14px; line-height: 1.6; }
</style>
</head>
<body>
<div id="chrome"></div>
<main class="wrap">
  <h1 class="tagline">בדיקת נתוני התשלומים</h1>
  <p class="hint">הדף הזה בודק אם קובצי התשלומים שאנחנו בונים מדוחות המשרדים
    (<code>data/paid/</code>) באמת הגיעו לאתר. אם רואים כאן ✘ — הנתונים לא הועלו,
    ובדף התקציב יופיע קו מפריד במקום סכומים.</p>
  <div id="out"></div>
</main>

<script>window.BASE = "../";</script>
<script src="../config.js"></script>
<script src="../shared/common.js"></script>
<script>
"use strict";
/* Deliberately standalone: it must be able to say "the data folder is not
   here" on a deployment where budget.data.js itself might not run.
   Everything lives inside one IIFE — these scripts share a single global
   scope, and re-declaring a name common.js already owns (esc) kills the whole
   file with a SyntaxError before a line of it runs. */
(function () {
const out = document.getElementById("out");

function card(title, rows) {
  const d = document.createElement("div");
  d.className = "card";
  d.innerHTML = `<div class="big">${esc(title)}</div>` + rows.map(r =>
    `<div class="row"><div class="st ${r.ok ? "ok" : "bad"}">${r.ok ? "✔" : "✘"}</div>
       <div><div>${r.file ? `<b dir="ltr">${esc(r.file)}</b> — ` : ""}${esc(r.name)}</div>
       <div class="u">${esc(r.info || "")}</div></div></div>`).join("");
  out.appendChild(d);
}

async function get(url) {
  const t0 = Date.now();
  try {
    const r = await fetch(url, { cache: "no-store" });
    if (!r.ok) return { ok: false, info: `HTTP ${r.status} · ${url}` };
    const j = await r.json();
    return { ok: true, j, ms: Date.now() - t0, info: `${url} · ${Date.now() - t0}ms` };
  } catch (e) {
    return { ok: false, info: `${e.message} · ${url}` };
  }
}

(async function () {
  const base = "../data/paid/";
  const man = await get(base + "index.json");

  if (!man.ok) {
    card("המניפסט", [{ ok: false, name: "data/paid/index.json לא נמצא", info: man.info }]);
    const local = location.protocol === "file:";
    card("מה כנראה קרה", [
      { ok: !local, name: local
          ? "הדף נפתח ישירות מהדיסק (file://) — הדפדפן חוסם קריאת קבצים מקומיים. צריך להריץ שרת מקומי או לפתוח את האתר המפורסם."
          : "הדף רץ משרת, כך שזו כנראה פשוט העלאה ישנה.",
        info: location.href },
      { ok: false, name: "צריך להעלות מחדש את תיקיית site — התיקייה data/ נוספה אחרי ההעלאה האחרונה.",
        info: "Netlify Drop / Cloudflare Pages / GitHub Pages" },
    ]);
    return;
  }

  const secs = (man.j && man.j.sections) || [];
  card("המניפסט", [
    { ok: true, name: `נמצא, ובו ${secs.length} סעיפים`, info: man.info },
  ]);

  const rows = [];
  let orders = 0;
  for (const s of secs) {
    const f = await get(base + s + ".json");
    if (!f.ok) { rows.push({ ok: false, file: s + ".json", name: "לא נמצא", info: f.info }); continue; }
    const n = Object.keys((f.j && f.j.orders) || {}).length;
    orders += n;
    rows.push({ ok: n > 0, file: s + ".json",
                name: `${n.toLocaleString("he-IL")} התקשרויות עם סכום ששולם`,
                info: ((f.j && f.j.sources) || []).join(" · ") });
  }
  card("קובצי הסעיפים", rows);
  card("סיכום", [{ ok: orders > 0,
    name: orders > 0 ? `${orders.toLocaleString("he-IL")} סכומים מדוחות המשרדים זמינים לדף התקציב`
                     : "לא נמצא אף סכום — הקבצים ריקים",
    info: "" }]);
})();

if (typeof buildChrome === "function") buildChrome();
})();
</script>
</body>
</html>
