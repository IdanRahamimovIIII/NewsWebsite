<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הכסף שלנו — שקיפות תקציב המדינה | Our Money — Israeli Budget Transparency</title>
<meta name="description" content="לאן הולך הכסף שלנו? תקציב מדינת ישראל, הכנסות, חוב והוצאות — בשפה פשוטה, מנתונים רשמיים.">
<link rel="stylesheet" href="shared/style.css">
<link rel="stylesheet" href="budget/budget.css">
</head>
<body>
<header class="topbar"></header>
<div class="wrap">

  <!-- the year, always within reach -->
  <div class="yearbar" id="yearbar">
    <div class="yearbar-in">
      <label for="yearsel" data-i18n="year"></label>
      <select id="yearsel" onchange="loadAll()"></select>
      <span class="yearstate" id="flowsnote"></span>
      <span class="loading" id="globalstate"></span>
    </div>
  </div>

  <!-- what comes in, what's borrowed, what it costs -->
  <div class="card" id="flowsec">
    <h2 data-i18n="flowsTitle"></h2>
    <div class="kpis" id="flows"></div>

    <h3 class="subhead" data-i18n="chartInTitle"></h3>
    <div class="legend" id="legIn"></div>
    <svg class="chart" id="chartIn" viewBox="0 0 900 340" role="img"
      aria-label="הכנסות המדינה לפי מקור, לפי שנה"></svg>
    <details class="tabletoggle">
      <summary data-i18n="tableToggle"></summary>
      <div class="tw"><table id="flowtbl"><thead></thead><tbody></tbody></table></div>
      <p class="axisnote" data-i18n="tableNote"></p>
    </details>
  </div>

  <!-- what the debt costs -->
  <div class="card">
    <h2 data-i18n="chartCostTitle"></h2>
    <p class="hint" data-i18n="chartCostHint"></p>
    <svg class="chart" id="chartCost" viewBox="0 0 900 250" role="img"
      aria-label="ריבית כאחוז מגביית המסים, לפי שנה"></svg>
    <p class="reads" id="costreads"></p>
    <p class="debtpara" id="debtpara"></p>
  </div>

  <!-- the tree: where the money goes -->
  <div class="card">
    <div class="cardhead">
      <h2 data-i18n="byMinistry"></h2>
      <div class="seg" id="modeswitch" role="group"></div>
    </div>
    <p class="hint" id="charthint"></p>
    <p class="treecount" id="treecount"></p>
    <div id="chart"><div class="loading" data-i18n="loading"></div></div>
    <div class="axisnote" id="chartnote"></div>
    <p class="scopenote" data-i18n="expenseOnly"></p>
  </div>

  <!-- supplier / contract search -->
  <div class="card">
    <h2 data-i18n="searchTitle"></h2>
    <p class="hint" data-i18n="searchHint"></p>
    <div class="searchrow">
      <input id="q" data-i18n-ph="searchPh" onkeydown="if(event.key==='Enter')doSearch()">
      <button onclick="doSearch()" data-i18n="searchBtn"></button>
    </div>
    <div id="searchout"></div>
  </div>

  <!-- explainer -->
  <div class="card explain">
    <h2 data-i18n="explainTitle"></h2>
    <p data-i18n="explain1"></p>
    <p data-i18n="explain2"></p>
    <p data-i18n="explain3"></p>
  </div>

  <footer>
    <span data-i18n="credit"></span>
    <a href="https://next.obudget.org" target="_blank" rel="noopener">obudget.org</a> ·
    <a href="https://data.gov.il" target="_blank" rel="noopener">data.gov.il</a> ·
    <a href="https://main.knesset.gov.il/Activity/Info/Pages/databases.aspx" target="_blank" rel="noopener">Knesset OData</a>
    <div id="debug" style="margin-top:6px"></div>
  </footer>
</div>

<div id="tip"></div>
<div class="pop" id="pop" role="dialog" aria-modal="false" tabindex="-1"></div>

<script src="config.js"></script>
<script src="budget/budget.strings.js"></script>
<script src="shared/common.js"></script>
<script src="budget/budget.data.js"></script>
<script src="budget/budget.view.js"></script>
</body>
</html>
