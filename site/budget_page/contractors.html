<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הכסף שלנו — ספקים והתקשרויות | Our Money — Suppliers &amp; Contracts</title>
<meta name="description" content="מי מקבל כסף מהממשלה? הספקים הגדולים, חיפוש התקשרויות, וכל ההתקשרויות של כל ספק — מנתונים רשמיים.">
<link rel="stylesheet" href="../shared/style.css">
<link rel="stylesheet" href="budget.css">
</head>
<body>
<header class="topbar"></header>

<!-- the budget section has two pages; this bar is how you move between them -->
<nav class="subnav">
  <div class="subnav-in">
    <a href="./" data-i18n="subBudget"></a>
    <a href="contractors.html" class="active" aria-current="page" data-i18n="subSuppliers"></a>
  </div>
</nav>

<div class="wrap">

  <!-- the year, always within reach -->
  <div class="yearbar" id="yearbar">
    <div class="yearbar-in">
      <label for="yearsel" data-i18n="year"></label>
      <select id="yearsel" onchange="loadYear()"></select>
      <span class="yearstate" id="yearnote"></span>
    </div>
  </div>

  <!-- one supplier, in full — opened by clicking a name anywhere on the page -->
  <div class="card" id="supcard" hidden>
    <div class="suphead">
      <h2 id="supname"></h2>
      <button class="supclose" type="button" onclick="closeSupplier()" data-i18n="supClose"></button>
    </div>
    <div class="supfacts" id="supfacts"></div>
    <div id="supbody"></div>
  </div>

  <!-- the numbers that make you stop scrolling -->
  <div class="card">
    <h2 data-i18n="tilesTitle"></h2>
    <p class="hint" id="tileshint"></p>
    <div class="kpis" id="tiles"><div class="loading" data-i18n="loading"></div></div>
  </div>

  <!-- who received the most, per year -->
  <div class="card">
    <div class="cardhead">
      <h2 data-i18n="topTitle"></h2>
      <div class="seg" id="topswitch" role="group"></div>
    </div>
    <p class="hint" id="tophint"></p>
    <div id="topout"><div class="loading" data-i18n="loading"></div></div>
    <p class="axisnote" id="topgap"></p>
    <p class="axisnote" id="topnote"></p>
  </div>

  <!-- which exemption routes carry the big money -->
  <div class="card">
    <h2 data-i18n="exTitle"></h2>
    <p class="hint" id="exhint"></p>
    <div id="exout"><div class="loading" data-i18n="loading"></div></div>
    <p class="axisnote" data-i18n="exNote"></p>
  </div>

  <!-- the ministry that is not here -->
  <div class="card explain">
    <h2 data-i18n="defTitle"></h2>
    <p data-i18n="defBody"></p>
  </div>

  <!-- supplier / contract search -->
  <div class="card">
    <h2 data-i18n="searchTitle"></h2>
    <p class="hint" data-i18n="searchHint"></p>
    <div class="searchrow">
      <input id="q" data-i18n-ph="searchPh" onkeydown="if(event.key==='Enter')doSearch()">
      <button onclick="doSearch()" data-i18n="searchBtn"></button>
    </div>
    <div id="searchout"></div>
  </div>

  <!-- explainer -->
  <div class="card explain">
    <h2 data-i18n="explainTitle"></h2>
    <p data-i18n="explain1"></p>
    <p data-i18n="explain2"></p>
    <p data-i18n="explain3"></p>
  </div>

  <footer>
    <span data-i18n="credit"></span>
    <a href="https://next.obudget.org" target="_blank" rel="noopener">obudget.org</a> ·
    <a href="https://mr.gov.il" target="_blank" rel="noopener">מינהל הרכש</a>
    <div id="debug" style="margin-top:6px"></div>
  </footer>
</div>

<div class="pop" id="pop" role="dialog" aria-modal="false" tabindex="-1"></div>

<script src="../shared/config.js"></script>
<script src="contractors.strings.js"></script>
<script src="../shared/common.js"></script>
<script src="contractors.data.js"></script>
<script src="contractors.view.js"></script>
</body>
</html>
