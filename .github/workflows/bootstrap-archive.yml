# PIPELINE v2 phase 1 (2026-09-08) - the ONE-TIME (re-runnable) bootstrap of
# THE PERMANENT RAW ARCHIVE.
#
# WHY THIS IS URGENT: today the raw ministry .xlsx files exist ONLY in the
# Actions cache, which GitHub evicts after 7 idle days - with a monthly
# schedule that eviction is routine. This workflow harvests whatever the
# cache still holds into the raw-archive Release (permanent, 2 GB/asset,
# no expiry) before anything else is lost. Run it MANUALLY, NOW, and again
# any time - re-running is harmless (content-addressed: already-archived
# files are skipped).
#
# What it does NOT cover: files already gone from both the cache and the
# live web. Their parsed rows survive in Mercy's contractors\inputs\
# full-records.zip - she uploads that (and the other inputs\ files) by hand
# onto the raw-archive release page as legacy-* assets, once. After that,
# the monthly collectors keep the archive current by themselves.
#
# Design: pipeline/contractors/NOTES.md, PIPELINE v2.
name: bootstrap the raw archive

on:
  workflow_dispatch:            # manual only - this is a bootstrap, not a schedule

permissions:
  contents: write               # uploads release assets + commits the manifest

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # whatever the reports cache still holds is the harvest
      - name: restore the downloaded reports
        uses: actions/cache@v5
        with:
          path: pipeline/reports
          key: reports-${{ github.run_id }}
          restore-keys: reports-

      - name: adopt a reports cache saved under the old layout
        run: |
          if [ -d reports ] && [ ! -d pipeline/reports ]; then
            mkdir -p pipeline
            mv reports pipeline/reports
            echo "adopted the old-layout cache into pipeline/reports"
          fi

      - name: how much did the cache still hold?
        run: |
          if [ -d pipeline/reports ]; then
            echo "$(ls pipeline/reports | grep -ci '\.xlsx\?$' || true) report files, $(du -sh pipeline/reports | cut -f1)"
          else
            echo "NOTHING - the cache is empty. The next 'collect ministry reports'"
            echo "run will re-download what is still online, and its archive step"
            echo "will ingest it. Reports gone from the web are covered only by"
            echo "the legacy full-records.zip Mercy uploads by hand."
            mkdir -p pipeline/reports
          fi

      - name: archive everything the cache held
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 pipeline/contractors/archive.py ensure-release
          python3 pipeline/contractors/archive.py ingest-reports \
            --reports pipeline/reports \
            --manifest pipeline/contractors/archive/manifest.json

      - name: commit the archive manifest
        run: |
          git config user.name  "our-money bot"
          git config user.email "bot@users.noreply.github.com"
          git add pipeline/contractors/archive
          if git diff --cached --quiet; then
            echo "manifest unchanged - nothing to commit"
          else
            git commit -m "archive: bootstrap the raw archive $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
