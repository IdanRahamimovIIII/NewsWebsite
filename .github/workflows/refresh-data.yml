# Collects the ministries' quarterly procurement reports and parses them.
# It does NOT combine the sources - that step is deliberately not wired in
# until collection is finished. See pipeline/contractors/NOTES.md, COLLECTION.
#
# MONTHLY, not quarterly: reports are published late, revised (rev 0..2),
# and 82 publishers are out of step. Cheap - only changed files download.
name: collect ministry reports

on:
  schedule:
    - cron: "17 3 1 * *"        # 03:17 UTC on the 1st  -  off the hour, nobody's rush
  workflow_dispatch:            # and on demand, from the Actions tab
    inputs:
      sections:
        description: "budget sections, comma separated (blank = the real list from raw_budget)"
        default: ""
      years:
        description: "report years to look in"
        default: "2026,2025,2024,2023,2022"
      wayback:
        description: "try the Wayback Machine for blocked and dead urls (yes/no)"
        default: "yes"
      allow-shrink:
        description: "commit even if the collection shrank (yes/no) - only after checking WHY"
        default: "no"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # xlrd reads the OLD Excel format (.xls) some ministries used into ~2020;
      # xlwt exists only so the tests can build one to parse
      - run: pip install openpyxl xlrd xlwt

      # the reports themselves are build inputs, not web content  -  they are
      # cached between runs rather than committed to the repo
      - name: restore the downloaded reports
        uses: actions/cache@v5
        with:
          path: pipeline/reports
          key: reports-${{ github.run_id }}
          restore-keys: reports-

      # refill an evicted cache FROM THE ARCHIVE before fetching - an
      # eviction then costs nothing and the never-shrink guard cannot trip
      # on a publisher that merely failed to re-fetch in time.
      - name: restore the reports from the raw archive
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p pipeline/reports
          python3 pipeline/contractors/pipeline2.py restore-reports --dest pipeline/reports

      # report URLs are NOT derivable (BudgetKey's index is used for
      # ADDRESSES only, no data). --wayback recovers blocked/dead urls from
      # the Internet Archive, stamped via=wayback. --deadline-minutes 240:
      # stop cleanly inside GitHub's 6h kill so parse/commit/cache still run.
      # Details: contractors/NOTES.md, "Collection".
      - name: ask where the reports are, and fetch the ones that changed
        timeout-minutes: 300
        run: |
          python3 pipeline/contractors/fetch_reports.py \
            --out pipeline/reports \
            --manifest pipeline/reports/manifest.json \
            --sections "${{ inputs.sections }}" \
            --years "${{ inputs.years || '2026,2025,2024,2023,2022' }}" \
            --deadline-minutes 240 \
            ${{ (inputs.wayback || 'yes') != 'no' && '--wayback' || '' }}

      # every fetched file goes into THE PERMANENT RAW ARCHIVE (content-
      # hashed; a revision is a NEW entry). BEFORE parsing, so a broken
      # parse cannot lose a raw file.
      - name: archive the raw reports, forever
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 pipeline/contractors/archive.py ensure-release
          python3 pipeline/contractors/archive.py ingest-reports \
            --reports pipeline/reports \
            --manifest pipeline/contractors/archive/manifest.json

      # oldest first - the newest report gets the last word on a cumulative
      # figure. The .full.json become the full-records artifact (the local
      # build's input); the lean documents in git are the merge base +
      # never-shrink baseline. No page reads them.
      - name: parse every report into pipeline/paid
        run: |
          python3 pipeline/contractors/parse_all.py \
            --reports pipeline/reports \
            --out pipeline/paid

      # no combining here (Mercy: sources stay separate until collection is
      # finished) - the merge lives in build-and-update.yml.
      # inventory.txt is read BEFORE it is overwritten: the run refuses to
      # commit a collection that shrank.
      - name: what have we collected so far
        run: |
          mkdir -p pipeline/collection
          python3 pipeline/contractors/inventory.py \
            --reports pipeline/reports \
            --parsed pipeline/paid \
            --budgetkey pipeline/build/raw \
            --out pipeline/collection/inventory.txt \
            ${{ inputs.allow-shrink == 'yes' && '--allow-shrink' || '' }}

      # the failure lists are DATA, not logs - committed beside the
      # inventory so someone can actually read the addresses.
      - name: keep the failure lists where they can be read
        run: |
          mkdir -p pipeline/collection
          cp pipeline/reports/failed.json      pipeline/collection/ 2>/dev/null || true
          cp pipeline/reports/unreachable.json pipeline/collection/ 2>/dev/null || true
          cp pipeline/reports/manifest.json    pipeline/collection/ 2>/dev/null || true

      # the rules are not decoration  -  a refresh that breaks one must not ship
      - name: the eight rules must still hold
        run: |
          python3 pipeline/tests/test_merge.py
          python3 pipeline/tests/test_fetch.py

      # every column of every row, ~240 MB - too big for git; the local
      # build (contractors/inputs/full-records.zip) reads this artifact.
      - name: keep the full records as a downloadable artifact
        uses: actions/upload-artifact@v7
        with:
          name: full-records
          path: pipeline/paid/*.full.json
          retention-days: 90
          if-no-files-found: warn

      # committed: pipeline/paid (lean documents - the merge base) and
      # pipeline/collection (inventory + failure lists). The .full.json
      # never enter git (artifact only).
      - name: commit whatever changed
        run: |
          git config user.name  "our-money bot"
          git config user.email "bot@users.noreply.github.com"
          git add pipeline/paid pipeline/collection pipeline/contractors/archive
          git rm --cached --ignore-unmatch -q pipeline/paid/*.full.json || true
          if git diff --cached --quiet; then
            echo "nothing changed this month"
          else
            git commit -m "data: monthly refresh $(date -u +%Y-%m-%d)"
            git push
          fi
